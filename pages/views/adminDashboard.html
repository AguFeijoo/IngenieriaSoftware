<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Panel de administración - Hotel Las Gaviotas</title>
  <script src="../../src/core/admin.js" defer></script>
  <script src="../../src/app.js" defer></script>
</head>
<body>
  <a href="index.html">← Volver al inicio</a>
  <h1>Panel de reservas</h1>

  <form id="filter-form">
    <label for="filter-check-in">Fecha de check in</label>
    <input type="date" id="filter-check-in">

    <label for="filter-guest">Huésped</label>
    <input type="text" id="filter-guest" placeholder="Nombre del huésped">

    <button type="submit">Buscar</button>
  </form>

  <div id="action-message"></div>

  <h2>Solicitudes pendientes</h2>
  <div id="reservations-list"></div>

  <h2>Reservas confirmadas</h2>
  <div id="confirmed-reservations-list"></div>
</body>
</html>
