<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles/index.css">
    <title>Panel de administración</title>
</head>
<body class="dashboard-page-body">
    <header class="dashboard-topbar">
        <div class="dashboard-brand">
            <span class="login-logo"></span>
            <span class="login-brand-name">Las Gaviotas</span>
        </div>
        <p class="dashboard-topbar-title">Panel de administración</p>
        <a class="dashboard-logout" href="adminLogin.html" id="btnLogout">Cerrar sesión</a>
    </header>

    <main class="dashboard-main">
        <section class="dashboard-header-mobile d-mobile-only">
            <h1 class="dashboard-header-mobile-title">Solicitudes de reserva</h1>
            <p class="dashboard-header-mobile-subtitle" id="reservations-subtitle-mobile">Cargando…</p>
        </section>

        <section class="dashboard-header-desktop d-desktop-only">
            <h1 class="dashboard-header-title">Solicitudes de reserva</h1>
            <p class="dashboard-header-subtitle" id="reservations-subtitle-desktop">Cargando…</p>
        </section>

        <section class="reservations-toolbar">
            <label class="reservations-search-label" for="reservations-search">
                <span class="sr-only">Buscar reserva</span>
                <span class="reservations-search-icon" aria-hidden="true">&#128269;</span>
                <input type="text" id="reservations-search" class="reservations-search-input" placeholder="Buscar por huésped, habitación...">
            </label>
            <div class="reservations-date-filters">
                <label class="reservations-date-label">
                    <span class="sr-only">Desde</span>
                    <input type="date" id="reservations-date-from" class="reservations-date-input">
                </label>
                <label class="reservations-date-label">
                    <span class="sr-only">Hasta</span>
                    <input type="date" id="reservations-date-to" class="reservations-date-input">
                </label>
            </div>
        </section>

        <ul class="reservations-list" id="reservations-list"></ul>
    </main>

    <script src="../../src/core/admin.js"></script>
    <script src="../../src/app.js"></script>
</body>
</html>
