<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="../styles/index.css">
  <title>Reservar - Hotel Las Gaviotas</title>
  <script src="../../src/core/booking.js" defer></script>
</head>

<body>
<nav class="navbar navbar-expand-lg sticky-top navbar-dark">
    <div class="container">
        <a class="navbar-brand fw-bold" href="index.html">🏖️ Las Gaviotas</a>
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item"><a class="nav-link" href="rooms.html">Habitaciones</a></li>
                <li class="nav-item"><a class="nav-link active" href="bookingForm.html">Reservar</a></li>
                <li class="nav-item"><a class="nav-link" href="reviews.html">Opiniones</a></li>
                <li class="nav-item"><a class="nav-link" href="contact.html">Contacto</a></li>
                <li class="nav-item"><a class="nav-link" href="adminLogin.html">Login</a></li>
            </ul>
        </div>
    </div>
</nav>

<main>
<section class="booking-section py-5">
    <div class="container">

        <div class="booking-header-mobile d-md-none">
            <h1 class="booking-header-mobile-title">Reservar habitación</h1>
            <p class="booking-header-mobile-subtitle">Completá tus datos y te confirmamos la disponibilidad</p>
        </div>

        <div class="booking-header-desktop d-none d-md-block">
            <h1 class="booking-header-title">Reservar habitación</h1>
            <p class="booking-header-subtitle">Completá tus datos y te confirmamos la disponibilidad</p>
        </div>

        <div class="booking-card">
            <form id="booking-form" class="booking-form">

                <div class="booking-form-row">
                    <div class="booking-field">
                        <label for="first-name">Nombre</label>
                        <input type="text" id="first-name" name="first-name">
                    </div>

                    <div class="booking-field">
                        <label for="last-name">Apellido</label>
                        <input type="text" id="last-name" name="last-name">
                    </div>
                </div>

                <div class="booking-form-row">
                    <div class="booking-field">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="nombre@email.com">
                    </div>

                    <div class="booking-field">
                        <label for="phone">Teléfono</label>
                        <input type="tel" id="phone" name="phone" placeholder="099123456">
                    </div>
                </div>

                <div class="booking-field">
                    <label for="room-type">Tipo de habitación</label>
                    <select id="room-type" name="room-type">
                        <option value="">Seleccione una opción</option>
                        <option value="standard">Estándar - $90</option>
                        <option value="double">Doble - $140</option>
                        <option value="suite">Suite - $190</option>
                        <option value="family">Familiar - $240</option>
                    </select>
                </div>

                <div class="booking-field">
                    <label for="guest-count">Cantidad de huéspedes</label>
                    <input type="number" id="guest-count" name="guest-count" min="1">
                </div>

                <div class="booking-form-row">
                    <div class="booking-field">
                        <label for="check-in">Fecha de ingreso</label>
                        <input type="date" id="check-in" name="check-in">
                    </div>

                    <div class="booking-field">
                        <label for="check-out">Fecha de salida</label>
                        <input type="date" id="check-out" name="check-out">
                    </div>
                </div>

                <div class="booking-field">
                    <label for="special-requests">Solicitudes especiales</label>
                    <textarea id="special-requests" name="special-requests" rows="3"></textarea>
                </div>

                <button type="submit" class="booking-submit">Reservar</button>
            </form>

            <p id="booking-message" class="booking-message"></p>
        </div>

    </div>
</section>
</main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>
</body>

</html>
