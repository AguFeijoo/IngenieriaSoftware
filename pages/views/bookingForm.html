<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Reservar - Hotel Las Gaviotas</title>
  <link rel="stylesheet" href="../styles/bookingForm.css">
  <script src="../../src/core/booking.js" defer></script>
  <script src="../../src/app.js" defer></script>
</head>
<body>
  <a href="index.html">← Volver al inicio</a>
  <h1>Reservar habitación</h1>

  <form id="booking-form">
    <label for="first-name">Nombre</label>
    <input type="text" id="first-name" name="first-name">
    <br>

    <label for="last-name">Apellido</label>
    <input type="text" id="last-name" name="last-name">
    <br>

    <label for="email">Email</label>
    <input type="email" id="email" name="email">
    <br>

    <label for="phone">Teléfono</label>
    <input type="tel" id="phone" name="phone">
    <br>

    <label for="room-type">Tipo de habitación</label>
    <select id="room-type" name="room-type">
      <option value="">Seleccione una opción</option>
      <option value="standard">Estándar - $90</option>
      <option value="double">Doble - $140</option>
      <option value="suite">Suite - $190</option>
      <option value="family">Familiar - $240</option>
    </select>
    <br>

    <label for="guest-count">Cantidad de huéspedes</label>
    <input type="number" id="guest-count" name="guest-count">
    <br>

    <label for="check-in">Fecha de ingreso</label>
    <input type="date" id="check-in" name="check-in">
    <br>

    <label for="check-out">Fecha de salida</label>
    <input type="date" id="check-out" name="check-out">
    <br>

    <label for="special-requests">Solicitudes especiales</label>
    <textarea id="special-requests" name="special-requests"></textarea>
    <br>

    <button type="submit">Reservar</button>
  </form>

  <div id="booking-message"></div>
</body>
</html>
