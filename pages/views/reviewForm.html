<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../styles/index.css">
    <link rel="stylesheet" href="../styles/general.css">
    <title>Dejar opinión | Hotel Las Gaviotas</title>
</head>

<body>
    <nav class="navbar navbar-expand-lg sticky-top navbar-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">🏖️ Las Gaviotas</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="rooms.html">Habitaciones</a></li>
                    <li class="nav-item"><a class="nav-link" href="bookingForm.html">Reservar</a></li>
                    <li class="nav-item"><a class="nav-link" href="gallery.html">Galería</a></li>
                    <li class="nav-item"><a class="nav-link" href="reviews.html">Opiniones</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contacto</a></li>
                    <li class="nav-item"><a class="nav-link" href="faqs.html">Preguntas Frecuentes</a></li>
                    <li class="nav-item"><a class="nav-link" href="adminLogin.html">Iniciar sesión</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        <section class="review-section py-5">
            <div class="container">

                <div class="review-header-mobile d-md-none">
                    <h1 class="review-header-mobile-title">Dejar opinión</h1>
                    <p class="review-header-mobile-subtitle">¡Nos interesa conocer tu experiencia!</p>
                </div>

                <div class="review-header-desktop d-none d-md-block">
                    <h1 class="review-header-title">Dejar opinión</h1>
                    <p class="review-header-subtitle">¡Nos interesa conocer tu experiencia!</p>
                </div>

                <div class="review-card">
                    <form action="" class="review-form">
                        <div class="review-field">
                            <label for="txtName">Nombre (*)</label>
                            <input type="text" id="txtName" required>
                        </div>

                        <div class="review-field">
                            <label for="slcRating">Valoración (*)</label>
                            <select id="slcRating" required>
                                <option value="0">Seleccione una opcón...</option>
                                <option value="1">&#11088</option>
                                <option value="2">&#11088&#11088</option>
                                <option value="3">&#11088&#11088&#11088</option>
                                <option value="4">&#11088&#11088&#11088&#11088</option>
                                <option value="5">&#11088&#11088&#11088&#11088&#11088</option>
                            </select>
                        </div>

                        <div class="review-field">
                            <label for="txtComment">Comentario</label>
                            <input type="text" id="txtComment">
                        </div>

                        <input type="button" id="btnSend" class="review-submit" value="Enviar">
                    </form>

                    <p id="msgReviewAlert" class="review-message"></p>
                </div>

            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="../../src/core/review.js"></script>
    <script src="../../src/app.js"></script>
</body>

</html>
